<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>TABLE PONG PRO</title>

<style>
html, body {
  margin: 0;
  padding: 0;
  overflow: hidden;
  background: black;
  touch-action: none;
}

/* 3/4縮小表示 + 中央 */
#wrap {
  position: absolute;
  top: 50%;
  left: 50%;
  transform-origin: center;
}

/* メニュー */
#menu {
  position: absolute;
  width: 100%;
  height: 100%;
  background: black;
  color: white;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  z-index: 10;
}

button {
  font-size: 18px;
  padding: 10px 18px;
  margin: 8px;
}

canvas {
  background: #111;
  display: block;
}
</style>
</head>

<body>

<div id="menu">
  <h1>TABLE PONG PRO</h1>
  <button onclick="start('cpu')">CPU対戦</button>
  <button onclick="start('online')">オンライン対戦</button>
</div>

<div id="wrap">
  <canvas id="game"></canvas>
</div>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

const wrap = document.getElementById("wrap");

// ===== 基準サイズ =====
const W = 1000;
const H = 600;

canvas.width = W;
canvas.height = H;

// ===== 3/4スケール =====
function resize(){
  const scale = Math.min(
    window.innerWidth / W,
    window.innerHeight / H
  ) * 0.75; // ← 3/4縮小

  wrap.style.transform = `translate(-50%, -50%) scale(${scale})`;
}
window.addEventListener("resize", resize);
resize();

// ===== テーブル枠 =====
function drawTable(){
  ctx.strokeStyle = "white";
  ctx.lineWidth = 4;
  ctx.strokeRect(10, 10, W-20, H-20);
}

// ===== ゲーム状態 =====
let mode = "cpu";
let running = false;

// ===== パドル =====
const PADDLE_W = 12;
const PADDLE_H = 70;

let left = { x: 30, y: 250 };
let right = { x: W - 42, y: 250 };

// ===== ボール =====
let ball = { x: 0, y: 0, vx: 0, vy: 0, r: 10 };

// ===== スコア =====
let scoreL = 0;
let scoreR = 0;

// ===== タッチ =====
let touchY = null;

// ===== モード選択 =====
function start(selectedMode){
  mode = selectedMode;
  document.getElementById("menu").style.display = "none";

  scoreL = 0;
  scoreR = 0;
  running = true;

  serve("left");
}

// ===== サーブ（ラケット発射）=====
function serve(side){
  if(side === "left"){
    ball.x = left.x + PADDLE_W + 5;
    ball.y = left.y + PADDLE_H/2;
    ball.vx = 9;
  } else {
    ball.x = right.x;
    ball.y = right.y + PADDLE_H/2;
    ball.vx = -9;
  }
  ball.vy = (Math.random()*6 - 3);
}

// ===== CPU =====
function cpu(){
  let target = ball.y - PADDLE_H/2;
  right.y += (target - right.y) * 0.08;
}

// ===== オンライン（仮構造）=====
let ws = null;

function connectOnline(){
  ws = new WebSocket("wss://example.com/pong");

  ws.onmessage = (msg)=>{
    let data = JSON.parse(msg.data);
    right.y = data.y;
    ball = data.ball;
  };
}

// ===== 角度反射 =====
function hit(paddle){
  let hit = (ball.y - paddle.y) / PADDLE_H;
  ball.vy = (hit - 0.5) * 10;
  ball.vx *= 1.05;
}

// ===== 更新 =====
function update(){

  if(!running) return;

  // 左操作
  if(touchY !== null){
    left.y = touchY - PADDLE_H/2;
  }

  // CPU
  if(mode === "cpu"){
    cpu();
  }

  // 制限
  left.y = Math.max(10, Math.min(H-PADDLE_H-10, left.y));
  right.y = Math.max(10, Math.min(H-PADDLE_H-10, right.y));

  // ボール
  ball.x += ball.vx;
  ball.y += ball.vy;

  // 枠内ブロック
  if(ball.y < 20 || ball.y > H-20){
    ball.vy *= -1;
  }

  // 左当たり
  if(ball.x < left.x + PADDLE_W &&
     ball.y > left.y &&
     ball.y < left.y + PADDLE_H){
    ball.vx = Math.abs(ball.vx);
    hit(left);
  }

  // 右当たり
  if(ball.x > right.x - PADDLE_W &&
     ball.y > right.y &&
     ball.y < right.y + PADDLE_H){
    ball.vx = -Math.abs(ball.vx);
    hit(right);
  }

  // 得点
  if(ball.x < 0){
    scoreR++;
    serve("right");
  }

  if(ball.x > W){
    scoreL++;
    serve("left");
  }
}

// ===== 描画 =====
function draw(){

  ctx.clearRect(0,0,W,H);

  // テーブル枠
  drawTable();

  // 中央線
  ctx.fillStyle = "#333";
  for(let y=20;y<H-20;y+=25){
    ctx.fillRect(W/2, y, 2, 15);
  }

  // パドル
  ctx.fillStyle = "white";
  ctx.fillRect(left.x,left.y,PADDLE_W,PADDLE_H);
  ctx.fillRect(right.x,right.y,PADDLE_W,PADDLE_H);

  // ボール
  ctx.beginPath();
  ctx.arc(ball.x,ball.y,ball.r,0,Math.PI*2);
  ctx.fill();

  // スコア
  ctx.font = "40px Arial";
  ctx.fillText(scoreL, W/4, 50);
  ctx.fillText(scoreR, W*3/4, 50);
}

// ===== ループ =====
function loop(){
  update();
  draw();
  requestAnimationFrame(loop);
}
loop();

// ===== 操作 =====
window.addEventListener("touchmove", e=>{
  touchY = e.touches[0].clientY;
});
</script>

</body>
</html>
