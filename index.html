<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>TABLE PONG CPU</title>

<style>
body {
  margin: 0;
  background: black;
  overflow: hidden;
  touch-action: none;
}

canvas {
  display: block;
}

/* スタート */
#menu {
  position: absolute;
  width: 100%;
  height: 100%;
  background: black;
  color: white;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
}

button {
  font-size: 20px;
  padding: 10px 20px;
}
</style>
</head>

<body>

<div id="menu">
  <h1>TABLE PONG</h1>
  <button onclick="start()">START</button>
</div>

<canvas id="game"></canvas>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

function resize(){
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
resize();
window.addEventListener("resize", resize);

// パドル（少し小さく）
const PADDLE_W = 12;
const PADDLE_H = 90;
const SPEED = 8;

// プレイヤー（左）
let left = {
  x: 30,
  y: 200,
  vy: 0
};

// CPU（右）
let right = {
  x: () => canvas.width - 42,
  y: 200
};

// ボール
let ball = {
  x: 0,
  y: 0,
  vx: 0,
  vy: 0,
  r: 10
};

let scoreL = 0;
let scoreR = 0;

let game = false;
let lastHitBy = "left";

// タッチ
let touchY = null;

function start(){
  document.getElementById("menu").style.display = "none";
  game = true;
  serve("left"); // 左から開始
}

// サーブ（ラケット位置から出す）
function serve(side){
  if(side === "left"){
    ball.x = left.x + PADDLE_W + 5;
    ball.y = left.y + PADDLE_H/2;
    ball.vx = 6;
  } else {
    ball.x = canvas.width - 45;
    ball.y = right.y + PADDLE_H/2;
    ball.vx = -6;
  }

  ball.vy = (Math.random()*4 - 2);
}

// CPU
function cpu(){
  let target = ball.y - PADDLE_H/2;
  right.y += (target - right.y) * 0.08;
}

// 更新
function update(){

  // タッチ or マウス
  if(touchY !== null){
    left.y = touchY - PADDLE_H/2;
  }

  // CPU動き
  cpu();

  // 制限
  left.y = Math.max(0, Math.min(canvas.height - PADDLE_H, left.y));
  right.y = Math.max(0, Math.min(canvas.height - PADDLE_H, right.y));

  // ボール移動
  ball.x += ball.vx;
  ball.y += ball.vy;

  // 壁反射
  if(ball.y < 0 || ball.y > canvas.height){
    ball.vy *= -1;
  }

  // 左ラケット当たり
  if(
    ball.x < left.x + PADDLE_W &&
    ball.y > left.y &&
    ball.y < left.y + PADDLE_H
  ){
    ball.vx *= -1;

    // 🔥 スマッシュ代わり：移動中なら強化
    if(Math.abs(left.vy) > 2){
      ball.vx *= 1.4;
    }

    lastHitBy = "left";
  }

  // 右ラケット当たり
  if(
    ball.x > canvas.width - 42 &&
    ball.y > right.y &&
    ball.y < right.y + PADDLE_H
  ){
    ball.vx *= -1;
    lastHitBy = "right";
  }

  // 得点
  if(ball.x < 0){
    scoreR++;
    serve("right"); // 取った方サーブ
  }

  if(ball.x > canvas.width){
    scoreL++;
    serve("left");
  }
}

// 描画
function draw(){

  ctx.clearRect(0,0,canvas.width,canvas.height);

  // 中央線
  ctx.fillStyle = "#333";
  for(let y=0;y<canvas.height;y+=25){
    ctx.fillRect(canvas.width/2, y, 2, 15);
  }

  // パドル
  ctx.fillStyle = "white";
  ctx.fillRect(left.x,left.y,PADDLE_W,PADDLE_H);
  ctx.fillRect(canvas.width-42,right.y,PADDLE_W,PADDLE_H);

  // ボール
  ctx.beginPath();
  ctx.arc(ball.x,ball.y,ball.r,0,Math.PI*2);
  ctx.fill();

  // スコア
  ctx.font = "40px Arial";
  ctx.fillText(scoreL, canvas.width/4, 50);
  ctx.fillText(scoreR, canvas.width*3/4, 50);
}

// ループ
function loop(){
  if(game){
    update();
    draw();
  }
  requestAnimationFrame(loop);
}

loop();

// タッチ操作
canvas.addEventListener("touchmove", (e)=>{
  touchY = e.touches[0].clientY;
});

canvas.addEventListener("mousemove", (e)=>{
  touchY = e.clientY;
});
</script>

</body>
</html>
