<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>TABLE PONG</title>

<style>
html, body {
  margin: 0;
  padding: 0;
  overflow: hidden;
  background: black;
  touch-action: none;
  height: 100%;
}

/* 中央スケール */
#wrap {
  position: absolute;
  top: 50%;
  left: 50%;
  transform-origin: center;
}

/* メニュー */
#menu {
  position: absolute;
  width: 100%;
  height: 100%;
  background: black;
  color: white;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  z-index: 10;
  text-align: center;
}

button {
  font-size: 18px;
  padding: 10px 18px;
  margin-top: 10px;
}

canvas {
  background: #111;
  display: block;
}
</style>
</head>

<body>

<div id="menu">
  <h1>TABLE PONG BLOCK</h1>
  <p>v1.0</p>
  <button onclick="start()">START</button>
</div>

<div id="wrap">
  <canvas id="game"></canvas>
</div>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

// ======================
// 基本サイズ（固定台）
const W = 1000;
const H = 600;

canvas.width = W;
canvas.height = H;

// ======================
// 横画面最適スケール（見切れ防止）
function resize(){
  const scale = Math.min(
    window.innerWidth / W,
    window.innerHeight / H
  ) * 0.75; // 余白込み

  document.getElementById("wrap").style.transform =
    `translate(-50%, -50%) scale(${scale})`;
}
window.addEventListener("resize", resize);
resize();

// ======================
// ラケット（修正）
// 太さ2倍 / 高さ3/4
const PADDLE_W = 24;   // ←2倍化
const PADDLE_H = 105;  // ←3/4くらい

// ボール（ブロック）
const BALL_SIZE = 20;

// ======================

let left = { x: 30, y: 250 };
let right = { x: W - 54, y: 250 };

let ball = { x: 0, y: 0, vx: 9, vy: 5 };

let scoreL = 0;
let scoreR = 0;

let running = false;
let touchY = null;

// ======================
// サーブ（ラケット発射）
function serve(side){

  if(side === "left"){
    ball.x = left.x + PADDLE_W + 5;
    ball.y = left.y + PADDLE_H/2;
    ball.vx = 9;
  } else {
    ball.x = right.x;
    ball.y = right.y + PADDLE_H/2;
    ball.vx = -9;
  }

  ball.vy = (Math.random()*6 - 3);
}

// ======================
// スタート
function start(){
  document.getElementById("menu").style.display = "none";

  scoreL = 0;
  scoreR = 0;
  running = true;

  serve("left");
}

// ======================
// CPU
function cpu(){
  let target = ball.y - PADDLE_H/2;
  right.y += (target - right.y) * 0.09;
}

// ======================
// 角度反射
function hit(paddle){
  let hit = (ball.y - paddle.y) / PADDLE_H;
  ball.vy = (hit - 0.5) * 12;
  ball.vx *= 1.05;
}

// ======================
// 更新
function update(){

  if(!running) return;

  if(touchY !== null){
    left.y = touchY - PADDLE_H/2;
  }

  cpu();

  // 画面内制限（見切れ防止）
  left.y = Math.max(10, Math.min(H-PADDLE_H-10, left.y));
  right.y = Math.max(10, Math.min(H-PADDLE_H-10, right.y));

  // ボール移動
  ball.x += ball.vx;
  ball.y += ball.vy;

  // 上下壁
  if(ball.y < 20 || ball.y > H-20){
    ball.vy *= -1;
  }

  // 左当たり
  if(
    ball.x < left.x + PADDLE_W &&
    ball.y > left.y &&
    ball.y < left.y + PADDLE_H
  ){
    ball.vx = Math.abs(ball.vx);
    hit(left);
  }

  // 右当たり
  if(
    ball.x > right.x - PADDLE_W &&
    ball.y > right.y &&
    ball.y < right.y + PADDLE_H
  ){
    ball.vx = -Math.abs(ball.vx);
    hit(right);
  }

  // 得点
  if(ball.x < 0){
    scoreR++;
    serve("right");
  }

  if(ball.x > W){
    scoreL++;
    serve("left");
  }
}

// ======================
// 描画
function draw(){

  ctx.clearRect(0,0,W,H);

  // 台枠
  ctx.strokeStyle = "white";
  ctx.lineWidth = 4;
  ctx.strokeRect(10,10,W-20,H-20);

  // 中央線
  ctx.fillStyle = "#333";
  for(let y=20;y<H-20;y+=25){
    ctx.fillRect(W/2, y, 2, 15);
  }

  // ラケット（ブロック）
  ctx.fillStyle = "white";
  ctx.fillRect(left.x,left.y,PADDLE_W,PADDLE_H);
  ctx.fillRect(right.x,right.y,PADDLE_W,PADDLE_H);

  // ボール（ブロック）
  ctx.fillRect(ball.x, ball.y, BALL_SIZE, BALL_SIZE);

  // スコア
  ctx.font = "40px Arial";
  ctx.fillText(scoreL, W/4, 50);
  ctx.fillText(scoreR, W*3/4, 50);
}

// ======================
// ループ
function loop(){
  update();
  draw();
  requestAnimationFrame(loop);
}
loop();

// ======================
// タッチ操作
window.addEventListener("touchmove", e=>{
  touchY = e.touches[0].clientY;
});
</script>

</body>
</html>
