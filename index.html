<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>TABLE PONG</title>

<style>
html, body {
  margin: 0;
  padding: 0;
  background: black;
  overflow: hidden;
  touch-action: none;
}

/* 画面全体を中央縮小表示 */
#wrap {
  position: absolute;
  top: 50%;
  left: 50%;
  transform-origin: center;
}

/* スタート・WIN画面 */
#menu {
  position: absolute;
  width: 100%;
  height: 100%;
  background: black;
  color: white;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  z-index: 10;
}

button {
  font-size: 20px;
  padding: 10px 20px;
  margin-top: 10px;
}

canvas {
  background: #111;
  display: block;
}
</style>
</head>

<body>

<div id="menu">
  <h1>TABLE PONG</h1>
  <button onclick="startGame()">START</button>
</div>

<div id="wrap">
  <canvas id="game"></canvas>
</div>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

const wrap = document.getElementById("wrap");

// 基準サイズ（ゲーム内部サイズ）
const BASE_W = 1000;
const BASE_H = 600;

canvas.width = BASE_W;
canvas.height = BASE_H;

// スケール調整（スマホに収める）
function resize(){
  const scale = Math.min(
    window.innerWidth / BASE_W,
    window.innerHeight / BASE_H
  );
  wrap.style.transform = `translate(-50%, -50%) scale(${scale})`;
}
window.addEventListener("resize", resize);
resize();

// パドル（小さめ）
const PADDLE_W = 12;
const PADDLE_H = 70;

// プレイヤー
let left = { x: 30, y: 200 };
let right = { x: BASE_W - 42, y: 200 };

// ボール
let ball = { x: 0, y: 0, vx: 8, vy: 4, r: 10 };

// スコア
let scoreL = 0;
let scoreR = 0;

// 状態
let gameRunning = false;
let touchY = null;

// サーブ
function serve(side){
  if(side === "left"){
    ball.x = left.x + PADDLE_W + 5;
    ball.y = left.y + PADDLE_H/2;
    ball.vx = 8;
  } else {
    ball.x = right.x;
    ball.y = right.y + PADDLE_H/2;
    ball.vx = -8;
  }
  ball.vy = (Math.random()*6 - 3);
}

// スタート
function startGame(){
  document.getElementById("menu").style.display = "none";
  scoreL = 0;
  scoreR = 0;
  gameRunning = true;
  serve("left");
}

// WIN画面
function win(winner){
  gameRunning = false;

  document.getElementById("menu").innerHTML = `
    <h1>${winner} WIN!</h1>
    <button onclick="location.reload()">RESTART</button>
  `;
  document.getElementById("menu").style.display = "flex";
}

// CPU
function cpu(){
  let target = ball.y - PADDLE_H/2;
  right.y += (target - right.y) * 0.08;
}

// 角度反射
function hit(paddle){
  let hit = (ball.y - paddle.y) / PADDLE_H;
  ball.vy = (hit - 0.5) * 10;
  ball.vx *= 1.05;
}

// 更新
function update(){

  if(!gameRunning) return;

  if(touchY !== null){
    left.y = touchY - PADDLE_H/2;
  }

  cpu();

  // 制限
  left.y = Math.max(0, Math.min(BASE_H-PADDLE_H, left.y));
  right.y = Math.max(0, Math.min(BASE_H-PADDLE_H, right.y));

  // ボール
  ball.x += ball.vx;
  ball.y += ball.vy;

  // 壁
  if(ball.y < 0 || ball.y > BASE_H){
    ball.vy *= -1;
  }

  // 左当たり
  if(ball.x < left.x + PADDLE_W &&
     ball.y > left.y &&
     ball.y < left.y + PADDLE_H){
    ball.vx = Math.abs(ball.vx);
    hit(left);
  }

  // 右当たり
  if(ball.x > right.x - PADDLE_W &&
     ball.y > right.y &&
     ball.y < right.y + PADDLE_H){
    ball.vx = -Math.abs(ball.vx);
    hit(right);
  }

  // 得点
  if(ball.x < 0){
    scoreR++;
    if(scoreR >= 10) return win("RIGHT");
    serve("right");
  }

  if(ball.x > BASE_W){
    scoreL++;
    if(scoreL >= 10) return win("LEFT");
    serve("left");
  }
}

// 描画
function draw(){

  ctx.clearRect(0,0,BASE_W,BASE_H);

  // 中央線
  ctx.fillStyle = "#333";
  for(let y=0;y<BASE_H;y+=25){
    ctx.fillRect(BASE_W/2, y, 2, 15);
  }

  // パドル
  ctx.fillStyle = "white";
  ctx.fillRect(left.x,left.y,PADDLE_W,PADDLE_H);
  ctx.fillRect(right.x,right.y,PADDLE_W,PADDLE_H);

  // ボール
  ctx.beginPath();
  ctx.arc(ball.x,ball.y,ball.r,0,Math.PI*2);
  ctx.fill();

  // スコア
  ctx.font = "40px Arial";
  ctx.fillText(scoreL, BASE_W/4, 50);
  ctx.fillText(scoreR, BASE_W*3/4, 50);
}

// ループ
function loop(){
  update();
  draw();
  requestAnimationFrame(loop);
}
loop();

// タッチ操作
window.addEventListener("touchmove", e=>{
  touchY = e.touches[0].clientY;
});
</script>

</body>
</html>
