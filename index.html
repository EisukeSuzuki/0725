<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>TABLE PONG FINAL</title>

<style>
html, body {
  margin: 0;
  padding: 0;
  overflow: hidden;   /* ←スクロール完全禁止 */
  background: black;
  touch-action: none;
}

canvas {
  display: block;
}
</style>
</head>

<body>

<canvas id="game"></canvas>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

function resize(){
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
resize();
window.addEventListener("resize", resize);

// 🎮 ラケット（3/4サイズ）
const PADDLE_W = 12;
const PADDLE_H = 70; // ←小さくした

const SPEED = 10;

// 左プレイヤー
let left = {
  x: 30,
  y: 200
};

// 右CPU
let right = {
  x: 0,
  y: 200
};

// ⚡ ボール（速度UP）
let ball = {
  x: 0,
  y: 0,
  vx: 9,   // ←速くした
  vy: 5,
  r: 10
};

let scoreL = 0;
let scoreR = 0;

let game = false;

// タッチ
let touchY = null;

// 🎯 サーブ
function serve(side){

  if(side === "left"){
    ball.x = left.x + PADDLE_W + 5;
    ball.y = left.y + PADDLE_H/2;
    ball.vx = 9;
  } else {
    ball.x = canvas.width - 45;
    ball.y = right.y + PADDLE_H/2;
    ball.vx = -9;
  }

  ball.vy = (Math.random()*6 - 3);
}

// CPU
function cpu(){
  let target = ball.y - PADDLE_H/2;
  right.y += (target - right.y) * 0.09;
}

// 角度計算（重要）
function hitAngle(paddle){
  let hit = (ball.y - paddle.y) / PADDLE_H;

  // -0.5〜+0.5くらいに調整
  ball.vy = (hit - 0.5) * 10;

  // 少しスピード加速
  ball.vx *= 1.05;
}

// 更新
function update(){

  // プレイヤー操作
  if(touchY !== null){
    left.y = touchY - PADDLE_H/2;
  }

  cpu();

  // 制限
  left.y = Math.max(0, Math.min(canvas.height-PADDLE_H, left.y));
  right.y = Math.max(0, Math.min(canvas.height-PADDLE_H, right.y));

  // ボール
  ball.x += ball.vx;
  ball.y += ball.vy;

  // 壁反射
  if(ball.y < 0 || ball.y > canvas.height){
    ball.vy *= -1;
  }

  // 左ラケット
  if(
    ball.x < left.x + PADDLE_W &&
    ball.y > left.y &&
    ball.y < left.y + PADDLE_H
  ){
    ball.vx = Math.abs(ball.vx);

    hitAngle(left); // ←角度反射
  }

  // 右ラケット
  if(
    ball.x > canvas.width - 42 &&
    ball.y > right.y &&
    ball.y < right.y + PADDLE_H
  ){
    ball.vx = -Math.abs(ball.vx);

    hitAngle(right);
  }

  // 得点
  if(ball.x < 0){
    scoreR++;
    serve("right"); // ←サーブ復活
  }

  if(ball.x > canvas.width){
    scoreL++;
    serve("left");
  }
}

// 描画
function draw(){

  ctx.clearRect(0,0,canvas.width,canvas.height);

  // 中央線
  ctx.fillStyle = "#333";
  for(let y=0;y<canvas.height;y+=25){
    ctx.fillRect(canvas.width/2, y, 2, 15);
  }

  // ラケット
  ctx.fillStyle = "white";
  ctx.fillRect(left.x,left.y,PADDLE_W,PADDLE_H);
  ctx.fillRect(canvas.width-42,right.y,PADDLE_W,PADDLE_H);

  // ボール
  ctx.beginPath();
  ctx.arc(ball.x,ball.y,ball.r,0,Math.PI*2);
  ctx.fill();

  // スコア
  ctx.font = "40px Arial";
  ctx.fillText(scoreL, canvas.width/4, 50);
  ctx.fillText(scoreR, canvas.width*3/4, 50);
}

// ループ
function loop(){
  if(game){
    update();
    draw();
  }
  requestAnimationFrame(loop);
}

loop();

// タッチ操作
window.addEventListener("touchmove", (e)=>{
  touchY = e.touches[0].clientY;
});

// 起動
game = true;
serve("left"); // 最初もサーブ
</script>

</body>
</html>
